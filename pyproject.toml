[project]
name = "sktree"
version = "0.1.0"
description = "A wrapper around the SKA2 split-k-mer engine for reference-free, alignment-free SNP discovery and phylogenetics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "skTree authors" }]
keywords = ["bioinformatics", "snp", "phylogenetics", "k-mer", "ska", "ska2"]
dependencies = [
    "biopython>=1.83",
    "dendropy>=4.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
annotate = ["pyrodigal>=3.3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
sktree = "sktree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sktree"]
artifacts = ["sktree/report_assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require the real `ska` binary (deselect with -m 'not integration')",
]
