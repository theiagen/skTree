name: Build and Push to GCP Artifact Registry

# Two image channels are published to Artifact Registry:
#   :dev      built from every push to main
#   :release  built when a GitHub Release is published, alongside an
#             immutable :<version> tag pinned to the release
on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: docker-publish-${{ github.ref }}
  # Supersede in-flight dev builds on main, but let release pushes run to
  # completion so a re-published tag never aborts an in-flight push.
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/general-theiagen/sktree/sktree
  DOCKERHUB_IMAGE: theiagen/sktree

permissions:
  contents: read

jobs:
  dev:
    name: Build and push :dev (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_ARTIFACT_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.DOCKERHUB_IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Build and push :release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            v*) ;;
            *)
              echo "ERROR: Release tag must start with 'v' (got '${TAG}')"
              exit 1
              ;;
          esac
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building release: ${TAG}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Build the released commit, not main's tip, so :release is
          # reproducible from the tag.
          ref: ${{ steps.meta.outputs.version }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_ARTIFACT_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :<version> is immutable and pinned to the release tag; :release
          # (and :latest on Docker Hub) is a moving pointer to the most
          # recent release.
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:release
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
